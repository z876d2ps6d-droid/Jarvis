<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#030a18">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&display=swap" rel="stylesheet">
<title>Jarvis</title>
<style>
:root{--ac:#5cf2ff;--mist:#d9f6ff;--glass:rgba(9,22,44,.58);--hf:'Chakra Petch',-apple-system,Helvetica,sans-serif}
body.idle{--ac:#5cf2ff}body.thinking{--ac:#ffb84d}body.speaking{--ac:#a88cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#030a18;color:var(--mist);font:16px/1.45 -apple-system,"SF Pro Text",Helvetica,sans-serif}
body{position:relative;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);background:radial-gradient(ellipse at 50% 32%,#0d2f57 0%,#07163a 42%,#030a18 100%)}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.8;background:
radial-gradient(1.5px 1.5px at 9% 12%,#fff 60%,transparent),radial-gradient(1px 1px at 24% 30%,#bfe 60%,transparent),
radial-gradient(1.5px 1.5px at 41% 8%,#fff 60%,transparent),radial-gradient(1px 1px at 63% 22%,#bfe 60%,transparent),
radial-gradient(1.5px 1.5px at 82% 11%,#fff 60%,transparent),radial-gradient(1px 1px at 92% 36%,#bfe 60%,transparent),
radial-gradient(1px 1px at 15% 52%,#fff 60%,transparent),radial-gradient(1px 1px at 74% 48%,#bfe 60%,transparent)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.floor{position:fixed;left:-60%;right:-60%;bottom:0;height:34%;z-index:0;pointer-events:none;opacity:.2;
background:linear-gradient(90deg,var(--ac) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(0deg,var(--ac) 1px,transparent 1px) 0 0/48px 48px;
transform:perspective(260px) rotateX(62deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(0deg,#000,transparent 85%);mask-image:linear-gradient(0deg,#000,transparent 85%)}
header,.stage,#out,.chips,.bar{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.brand{font:600 15px var(--hf);letter-spacing:.42em;color:var(--ac)}
#cfg{background:none;border:1px solid rgba(217,246,255,.2);color:var(--mist);width:36px;height:36px;border-radius:50%;padding:0;font-size:16px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* Sfera originale */
.hud{position:relative;width:min(86vw,380px);aspect-ratio:1}
.hud svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{transform-box:fill-box;transform-origin:center;fill:none;stroke:#00d4ff}
.a{animation:rot 24s linear infinite}
.b{animation:rot 16s linear infinite reverse}
.c{animation:rot 10s linear infinite}
.d{animation:rot 40s linear infinite reverse}
.speaking .a{animation-duration:6s}.speaking .b{animation-duration:4s}.speaking .c{animation-duration:2.5s}
.thinking .c{animation-duration:1.2s}
@keyframes rot{to{transform:rotate(360deg)}}
.core{position:absolute;left:50%;top:50%;width:34%;height:34%;margin:-17% 0 0 -17%;border-radius:50%;background:radial-gradient(circle,#eaffff 0%,#5ff0ff 25%,#00b8e6 55%,rgba(0,120,170,.2) 80%,transparent 100%);box-shadow:0 0 40px #00d4ff,0 0 90px rgba(0,212,255,.6);animation:br 3.5s ease-in-out infinite;transition:transform .09s}
.speaking .core{animation:none}
.thinking .core{animation:br .8s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.12);box-shadow:0 0 60px #00d4ff,0 0 120px rgba(0,212,255,.7)}}
.stat{font:500 13px var(--hf);letter-spacing:.5em;padding-left:.5em;color:var(--ac);margin-top:6px}
#out{max-height:20dvh;overflow-y:auto;margin-top:12px;padding:14px 16px;white-space:pre-wrap;line-height:1.5;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(217,246,255,.14);border-left:2px solid var(--ac);border-radius:4px 22px 4px 22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font:500 13px var(--hf);letter-spacing:.04em;color:var(--mist);background:var(--glass);border:1px solid rgba(217,246,255,.2);border-radius:999px;padding:9px 14px}
.tg:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#52627a;margin-right:8px}
.tg.on:before{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.bar{display:flex;gap:8px;padding:4px 0 10px}
input{flex:1;min-width:0;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(217,246,255,.25);color:var(--mist);border-radius:999px;padding:13px 18px;font-size:16px;outline:none}
input:focus{border-color:var(--ac)}
#send{background:var(--ac);color:#021018;border:0;border-radius:999px;padding:0 22px;font:600 14px var(--hf)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head>
<body class="idle">
<canvas id="bg"></canvas>
<div class="floor"></div>
<header><span class="brand">Jarvis</span><button id="cfg" onclick="reset()" aria-label="Impostazioni">⚙</button></header>
<div class="stage"><div class="hud idle" id="hud">
<svg viewBox="0 0 400 400">
<circle class="ring d" cx="200" cy="200" r="190" stroke-width="1" stroke-dasharray="2 8"/>
<circle class="ring a" cx="200" cy="200" r="178" stroke-width="5" stroke-dasharray="90 40 30 40" opacity=".8"/>
<circle class="ring b" cx="200" cy="200" r="152" stroke-width="2" stroke-dasharray="4 6"/>
<circle class="ring c" cx="200" cy="200" r="128" stroke-width="8" stroke-dasharray="60 120" opacity=".9"/>
<circle class="ring a" cx="200" cy="200" r="104" stroke-width="2" stroke-dasharray="20 10 5 10"/>
<circle cx="200" cy="200" r="88" fill="none" stroke="#00d4ff" stroke-width="1" opacity=".5"/>
</svg>
<div class="core" id="core"></div>
</div><div class="stat" id="stat">online</div></div>
<div id="out">Sistemi operativi. Dimmi pure.</div>
<div class="chips">
<button onclick="proposte()">Proposte</button>
<button onclick="chiedi('Riassumi le ultime proposte e dimmi quale conviene di più')">La migliore</button>
<button id="vb" class="tg on" onclick="toggleVoce()">Voce on</button>
<button id="mic" class="tg" onclick="toggleAscolto()">Ascolto off</button>
</div>
<div class="bar">
<input id="q" placeholder="Chiedi a Jarvis…" onkeydown="if(event.key==='Enter')chiedi()">
<button id="send" onclick="chiedi()">Invia</button>
</div>
<script>
var hud=document.getElementById('hud'),core=document.getElementById('core'),stat=document.getElementById('stat'),out=document.getElementById('out'),inp=document.getElementById('q'),vb=document.getElementById('vb'),mic=document.getElementById('mic'),bg=document.getElementById('bg'),bx=bg.getContext('2d');
var voce=true,anim=null,safety=null,fine=0,mode='idle';
var NOMI={idle:'online',thinking:'elaboro',speaking:'rispondo'};
function cfg(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function salva(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function reset(){try{localStorage.removeItem('jurl');localStorage.removeItem('jcod')}catch(e){}out.textContent='Impostazioni cancellate. Riavvia la pagina per reinserirle.'}
function setup(){
if(!cfg('jurl')){var u=prompt('Incolla l’URL di Apps Script (finisce con /exec)');if(u)salva('jurl',u.trim())}
if(!cfg('jcod')){var c=prompt('Scrivi il tuo codice segreto');if(c)salva('jcod',c.trim())}}
function setState(s){mode=s;hud.className='hud '+s;document.body.className=s;stat.textContent=NOMI[s];clearInterval(anim);core.style.transform='';
if(s==='speaking'){anim=setInterval(function(){core.style.transform='scale('+(1+Math.random()*0.4)+')'},110)}}
function sblocca(){if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
function parla(t){
if(!voce||!window.speechSynthesis){setState('idle');return}
speechSynthesis.cancel();
var u=new SpeechSynthesisUtterance(t);u.lang='it-IT';
var vs=speechSynthesis.getVoices(),pref=['Emma','Federica','Paola','Alice','Elsa','Silvia'],sc=null;
for(var k=0;k<pref.length&&!sc;k++){for(var i=0;i<vs.length;i++){if(vs[i].lang.indexOf('it')===0&&vs[i].name.indexOf(pref[k])>-1){sc=vs[i];break}}}
if(!sc){for(var j=0;j<vs.length;j++){if(vs[j].lang.indexOf('it')===0){sc=vs[j];break}}}
if(sc)u.voice=sc;u.rate=0.95;u.pitch=1.05;
u.onstart=function(){setState('speaking')};
u.onend=u.onerror=function(){clearTimeout(safety);fine=Date.now();setState('idle')};
speechSynthesis.speak(u);
clearTimeout(safety);safety=setTimeout(function(){setState('idle')},t.length*90+3000)}
function api(payload,ok,ko){
setup();
payload.codice=cfg('jcod');
fetch(cfg('jurl'),{method:'POST',body:JSON.stringify(payload)})
.then(function(r){return r.json()}).then(ok).catch(function(e){ko('Impossibile contattare Jarvis. Controlla URL e codice (tasto ⚙).')})}
function chiedi(t){t=(t||inp.value).trim();if(!t)return;inp.value='';sblocca();
out.textContent='> '+t;setState('thinking');
api({testo:t},function(d){if(d.errore){out.textContent=d.errore+'. Tocca ⚙ per reinserire i dati.';setState('idle')}else{out.textContent=d.risposta;parla(d.risposta)}},function(m){out.textContent=m;setState('idle')})}
function proposte(){setState('thinking');out.textContent='Recupero proposte…';
api({azione:'proposte'},function(d){setState('idle');if(d.errore){out.textContent=d.errore;return}var a=d.proposte||[];out.textContent=a.length?a.map(function(p){return '📩 '+p.d+'\n'+p.o+'\n'+p.r}).join('\n\n———\n\n'):'Nessuna proposta registrata.'},function(m){out.textContent=m;setState('idle')})}
function toggleVoce(){voce=!voce;sblocca();vb.textContent=voce?'Voce on':'Voce off';vb.classList.toggle('on',voce);if(!voce){speechSynthesis.cancel();setState('idle')}}
var rec=null,asc=false,att=false;
function micOff(){asc=false;mic.textContent='Ascolto off';mic.classList.remove('on')}
function toggleAscolto(){
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){out.textContent='Riconoscimento vocale non disponibile. Usa il microfono della tastiera.';return}
if(asc){micOff();if(rec)rec.stop();return}
sblocca();
rec=new SR();rec.lang='it-IT';rec.continuous=true;rec.interimResults=false;
rec.onresult=function(e){
if(hud.className.indexOf('idle')<0||Date.now()-fine<1500)return;
var t=e.results[e.results.length-1][0].transcript.trim(),l=t.toLowerCase();
if(att){att=false;chiedi(t);return}
var i=l.indexOf('jarvis');if(i<0)return;
var c=t.slice(i+6).replace(/^[\s,.:!?]+/,'');
if(c){chiedi(c)}else{att=true;out.textContent='Dimmi…';parla('Dimmi')}};
rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){micOff();out.textContent='Microfono non consentito. Controlla Impostazioni > Safari > Microfono.'}};
rec.onend=function(){if(asc){try{rec.start()}catch(x){}}};
try{rec.start();asc=true;mic.textContent='Dì “Jarvis”';mic.classList.add('on')}catch(x){out.textContent='Impossibile attivare il microfono.'}}

/* Sfondo: rete di connessione 3D (linee digitali e pacchetti dati) */
var BW=0,BH=0,t0=0,spin=0,rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
var COL={idle:[92,242,255],thinking:[255,184,77],speaking:[168,140,255]},cur=COL.idle.slice();
var nd=[],ed=[],pk=[],P=[],M=72;
(function(){
for(var n=0;n<M;n++){var y=1-(n+.5)/M*2,r=Math.sqrt(1-y*y),th=n*2.39996+Math.random()*.4,rad=.45+Math.random()*.55;nd.push([Math.cos(th)*r*rad,y*rad,Math.sin(th)*r*rad])}
nd.push([0,0,0]);
var seen={};
function add(a,b){var k=a<b?a+'-'+b:b+'-'+a;if(seen[k]||a===b)return;seen[k]=1;ed.push([a,b])}
for(var i=0;i<M;i++){var ds=[];for(var j=0;j<M;j++){if(j!==i){var dx=nd[i][0]-nd[j][0],dy=nd[i][1]-nd[j][1],dz=nd[i][2]-nd[j][2];ds.push([dx*dx+dy*dy+dz*dz,j])}}
ds.sort(function(a,b){return a[0]-b[0]});add(i,ds[0][1]);add(i,ds[1][1])}
for(var k=0;k<M;k+=5)add(M,k);
for(var q=0;q<48;q++)pk.push({e:Math.floor(Math.random()*ed.length),t:Math.random(),v:.3+Math.random()*.5,f:Math.random()<.5})
})();
function fit(){var d=Math.min(window.devicePixelRatio||1,2);BW=window.innerWidth;BH=window.innerHeight;bg.width=BW*d;bg.height=BH*d;bx.setTransform(d,0,0,d,0,0)}
function frame(ts){
var dt=Math.min((ts-t0)/1000||0,.05);t0=ts;
var rf=rm?.25:1;
spin+=dt*(mode==='thinking'?.55:mode==='speaking'?.28:.09)*rf;
var tc=COL[mode];for(var k=0;k<3;k++)cur[k]+=(tc[k]-cur[k])*.07;
var rgb=Math.round(cur[0])+','+Math.round(cur[1])+','+Math.round(cur[2]);
bx.clearRect(0,0,BW,BH);
var hr=hud.getBoundingClientRect(),ox=hr.left+hr.width/2,oy=hr.top+hr.height/2;
var Rn=Math.max(BW,BH)*.55,f=Rn*2.6,ca=Math.cos(spin),sa=Math.sin(spin),ct=.94,st=.34;
for(var i=0;i<=M;i++){var q=nd[i],x=q[0]*ca+q[2]*sa,z0=-q[0]*sa+q[2]*ca,y=q[1]*ct-z0*st,z=(q[1]*st+z0*ct),s=f/(f-z*Rn);
P[i]=[ox+x*Rn*s,oy+y*Rn*s,(z+1)/2]}
bx.lineWidth=1;
for(var i=0;i<ed.length;i++){var e=ed[i],a=P[e[0]],b=P[e[1]],sp=(e[0]===M||e[1]===M);
bx.strokeStyle='rgba('+rgb+','+((sp?.14:.05)+.22*(a[2]+b[2])/2).toFixed(2)+')';bx.beginPath();bx.moveTo(a[0],a[1]);bx.lineTo(b[0],b[1]);bx.stroke()}
for(var i=0;i<M;i++){var a=P[i],sz=1.6+2.6*a[2];
bx.fillStyle='rgba('+rgb+','+(.25+.65*a[2]).toFixed(2)+')';bx.fillRect(a[0]-sz/2,a[1]-sz/2,sz,sz);
if(i%5===0){bx.strokeStyle='rgba('+rgb+','+(.2+.4*a[2]).toFixed(2)+')';bx.strokeRect(a[0]-sz,a[1]-sz,sz*2,sz*2)}}
var sf=(mode==='thinking'?2.4:mode==='speaking'?1.5:.55)*(rm?.3:1);
for(var i=0;i<pk.length;i++){var o=pk[i];o.t+=dt*o.v*sf;
if(o.t>=1){o.e=Math.floor(Math.random()*ed.length);o.t=0;o.f=Math.random()<.5}
var e=ed[o.e],a=P[o.f?e[0]:e[1]],b=P[o.f?e[1]:e[0]],t2=Math.max(0,o.t-.14),d=(a[2]+b[2])/2,
ux=a[0]+(b[0]-a[0])*o.t,uy=a[1]+(b[1]-a[1])*o.t,wx=a[0]+(b[0]-a[0])*t2,wy=a[1]+(b[1]-a[1])*t2;
bx.strokeStyle='rgba(255,255,255,'+(.2+.5*d).toFixed(2)+')';bx.lineWidth=1.5;bx.beginPath();bx.moveTo(wx,wy);bx.lineTo(ux,uy);bx.stroke();
bx.fillStyle='rgba('+rgb+',.28)';bx.beginPath();bx.arc(ux,uy,5,0,6.2832);bx.fill();
bx.fillStyle='#fff';bx.beginPath();bx.arc(ux,uy,1.7,0,6.2832);bx.fill()}
requestAnimationFrame(frame)}
fit();window.addEventListener('resize',fit);requestAnimationFrame(frame);
</script>
</body></html>
